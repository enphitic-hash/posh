name: Build web + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL || 'https://enphitic-hash.github.io/posh/' }}

      - name: Zip web build
        run: cd dist && zip -qr ../posh-web.zip .

      - name: Publish web version to GitHub Pages (gh-pages branch)
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf .git .nojekyll

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME).
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Posh-Passport.apk

      - uses: actions/upload-artifact@v4
        with:
          name: posh-passport
          path: |
            Posh-Passport.apk
            posh-web.zip

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Posh Passport (latest build)
          prerelease: true
          make_latest: true
          body: |
            Built from ${{ github.sha }}.
            - **Posh-Passport.apk**: install on any Android phone (allow "install unknown apps").
            - **Live web version**: https://enphitic-hash.github.io/posh/ (app: #/app, office: #/office)
            - **posh-web.zip**: the same web build, to host anywhere (any folder).
            - Database: run `supabase/schema.sql` (and optionally `supabase/seed.sql`) from the repo. See README.
          files: |
            Posh-Passport.apk
            posh-web.zip

      - name: Deploy to Cloudflare Pages (only if secrets are set)
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT || 'posh-passport' }}" --branch main
