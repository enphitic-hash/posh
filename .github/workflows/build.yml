name: Build web + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Zip web build (upload to victorbee.com/posh/)
        run: cd dist && zip -qr ../posh-web.zip .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Posh-Passport.apk

      - uses: actions/upload-artifact@v4
        with:
          name: posh-passport
          path: |
            Posh-Passport.apk
            posh-web.zip

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Posh Passport (latest build)
          prerelease: true
          make_latest: true
          body: |
            Built from ${{ github.sha }}.
            - **Posh-Passport.apk**: install on any Android phone (allow "install unknown apps").
            - **posh-web.zip**: unzip into the `posh/` folder of victorbee.com.
          files: |
            Posh-Passport.apk
            posh-web.zip

      - name: Deploy to Cloudflare Pages (only if secrets are set)
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT || 'posh-passport' }}" --branch main
