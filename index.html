<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Posh Passport · Posh Properties</title>
    <meta name="description" content="Posh Passport: one system for every Posh Properties business. Pay rent with a Posh card tap, verify any property with its NFC plaque, and run sales, construction, management, valuation and mortgages from one office." />
    <meta name="theme-color" content="#136734" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Posh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Posh Passport · Posh Properties Ltd" />
    <meta property="og:description" content="One system for every Posh business. One tap to trust any Posh property." />
    <meta property="og:image" content="https://enphitic-hash.github.io/posh/brand/og-image.png" />
    <meta property="og:url" content="https://enphitic-hash.github.io/posh/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#1A8043,#062E17);color:#fff;font-family:Georgia,serif;transition:opacity .35s}
      #boot.boot-out{opacity:0;pointer-events:none}
      #boot svg{width:120px;height:auto}
      #boot path{stroke-dasharray:200;stroke-dashoffset:200;animation:bt 1.4s ease-in-out infinite alternate}
      #boot .w{font-size:40px;letter-spacing:4px}
      #boot .s{font:600 11px/1 system-ui,sans-serif;letter-spacing:6px;color:#E3B93A}
      #boot .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
      #boot .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#ED1F24,#4ADE80);animation:bb 1.1s ease-in-out infinite}
      @keyframes bt{to{stroke-dashoffset:0}}
      @keyframes bb{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-label="Loading Posh">
      <svg viewBox="0 0 100 90"><g fill="none" stroke-width="3.6" stroke-miterlimit="1.5" stroke-linecap="square">
        <path stroke="#FF5A5F" d="M14 78 V62 L22 57 V78"/><path stroke="#FF5A5F" d="M28 78 V46 L37 40 V78"/><path stroke="#FF5A5F" d="M43 78 V26 L50 14 V78"/>
        <path stroke="#fff" d="M50 14 L57 26 V78"/><path stroke="#fff" d="M63 78 V36 L71 41 V78"/><path stroke="#fff" d="M77 78 V52 L85 57 V78"/>
        <path stroke="#FF5A5F" d="M6 78 H50"/><path stroke="#fff" d="M50 78 H94"/></g></svg>
      <div class="w">POSH</div>
      <div class="s">PASSPORT</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
